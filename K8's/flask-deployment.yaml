apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: flask-app

  template:
    metadata:
      labels:
        app: flask-app

    spec:
      containers:
      - name: flask

        image: YOUR_DOCKERHUB_USERNAME/devops-webapp:latest

        ports:
        - containerPort: 5000