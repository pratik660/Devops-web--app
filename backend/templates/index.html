<!DOCTYPE html>
<html>
<head>
    <title>DevOps User Management</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            margin: auto;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        form {
            margin-bottom: 20px;
        }

        input[type="text"],
        input[type="email"] {

            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;

            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {

            background-color: #28a745;
            color: white;

            border: none;
            padding: 10px 20px;

            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        table {

            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table,
        th,
        td {

            border: 1px solid #ddd;
        }

        th {

            background-color: #343a40;
            color: white;

            padding: 12px;
        }

        td {

            padding: 10px;
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .edit-btn {

            background-color: #007bff;
            color: white;

            padding: 6px 12px;
            border-radius: 4px;

            text-decoration: none;
        }

        .delete-btn {

            background-color: #dc3545;
            color: white;

            padding: 6px 12px;
            border-radius: 4px;

            text-decoration: none;
        }

        .logout {

            float: right;
            text-decoration: none;

            background-color: #6c757d;
            color: white;

            padding: 10px 15px;
            border-radius: 5px;
        }

        .logout:hover {
            opacity: 0.9;
        }

    </style>

</head>

<body>

<div class="container">

    <a href="/logout" class="logout">
        Logout
    </a>

    <h1>DevOps User Management System</h1>

    <h3>Add New User</h3>

    <form method="POST">

        <label>Name</label>

        <input
            type="text"
            name="name"
            placeholder="Enter Name"
            required>

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter Email"
            required>

        <button type="submit">
            Add User
        </button>

    </form>

    <h3>User Records</h3>

    <table>

        <tr>

            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Actions</th>

        </tr>

        {% for user in users %}

        <tr>

            <td>{{ user[0] }}</td>
            <td>{{ user[1] }}</td>
            <td>{{ user[2] }}</td>

            <td>

                <a
                    href="/edit/{{ user[0] }}"
                    class="edit-btn">
                    Edit
                </a>

                <a
                    href="/delete/{{ user[0] }}"
                    class="delete-btn"
                    onclick="return confirm('Are you sure you want to delete this user?')">
                    Delete
                </a>

            </td>

        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
