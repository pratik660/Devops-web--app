<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
            margin: 0;
        }

        .login-box {

            background: white;
            padding: 30px;

            border-radius: 10px;

            width: 350px;

            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        input {

            width: 100%;
            padding: 10px;

            margin-top: 10px;
            margin-bottom: 15px;

            border: 1px solid #ccc;
            border-radius: 5px;

            box-sizing: border-box;
        }

        button {

            width: 100%;
            padding: 10px;

            background-color: #28a745;
            color: white;

            border: none;
            border-radius: 5px;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .credentials {

            margin-top: 20px;
            padding: 10px;

            background-color: #f8f9fa;
            border-radius: 5px;

            font-size: 14px;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h2>DevOps Web App Login</h2>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <button type="submit">
            Login
        </button>

    </form>

    <div class="credentials">

        <strong>Demo Credentials</strong>

        <p>
            Username: admin
        </p>

        <p>
            Password: admin
        </p>

    </div>

</div>

</body>
</html>
